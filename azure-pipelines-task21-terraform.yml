trigger: none

pool:
  name: batch13-pool

variables:
  serviceConnection: 'batch13-connection'
  terraformDirectory: '$(System.DefaultWorkingDirectory)/terraform'

stages:

# =========================================================
# BUILD
# =========================================================
- stage: Build
  displayName: Build

  jobs:
  - job: BuildJob
    displayName: Build Application

    steps:

    - powershell: |
        Write-Host "========================================"
        Write-Host "BUILD STAGE"
        Write-Host "========================================"

        Write-Host "Checking Terraform..."
        terraform version

        Write-Host "Checking Azure CLI..."
        az version

        Write-Host "Build completed successfully."
      displayName: 'Build and Verify Tools'


# =========================================================
# TERRAFORM
# =========================================================
- stage: Terraform
  displayName: Terraform
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: TerraformJob
    displayName: Terraform Init Plan Apply

    steps:

    # -----------------------------------------------------
    # Azure Login
    # -----------------------------------------------------
    - task: AzureCLI@2
      displayName: 'Azure Login'
      inputs:
        azureSubscription: '$(serviceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "========================================"
          Write-Host "AZURE LOGIN"
          Write-Host "========================================"

          az account show

    # -----------------------------------------------------
    # Terraform Init
    # -----------------------------------------------------
    - powershell: |
        Write-Host "========================================"
        Write-Host "TERRAFORM INIT"
        Write-Host "========================================"

        Set-Location "$(terraformDirectory)"

        terraform version
        terraform init

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform init failed."
            exit 1
        }
      displayName: 'Terraform Init'

    # -----------------------------------------------------
    # Terraform Validate
    # -----------------------------------------------------
    - powershell: |
        Write-Host "========================================"
        Write-Host "TERRAFORM VALIDATE"
        Write-Host "========================================"

        Set-Location "$(terraformDirectory)"

        terraform validate

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform validate failed."
            exit 1
        }
      displayName: 'Terraform Validate'

    # -----------------------------------------------------
    # Terraform Plan
    # -----------------------------------------------------
    - powershell: |
        Write-Host "========================================"
        Write-Host "TERRAFORM PLAN"
        Write-Host "========================================"

        Set-Location "$(terraformDirectory)"

        terraform plan -out=tfplan

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform plan failed."
            exit 1
        }
      displayName: 'Terraform Plan'

    # -----------------------------------------------------
    # Publish Terraform Plan
    # -----------------------------------------------------
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(terraformDirectory)/tfplan'
        artifact: 'terraform-plan'

    # -----------------------------------------------------
    # Terraform Apply
    # -----------------------------------------------------
    - powershell: |
        Write-Host "========================================"
        Write-Host "TERRAFORM APPLY"
        Write-Host "========================================"

        Set-Location "$(terraformDirectory)"

        terraform apply -auto-approve tfplan

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform apply failed."
            exit 1
        }
      displayName: 'Terraform Apply'

    # -----------------------------------------------------
    # Terraform Output
    # -----------------------------------------------------
    - powershell: |
        Write-Host "========================================"
        Write-Host "TERRAFORM OUTPUT"
        Write-Host "========================================"

        Set-Location "$(terraformDirectory)"

        terraform output

        $vmIp = terraform output -raw public_ip 2>$null

        if ($LASTEXITCODE -eq 0 -and $vmIp) {
            Write-Host "Terraform VM IP: $vmIp"

            Write-Host "##vso[task.setvariable variable=TerraformPublicIP;isOutput=true]$vmIp"
        }
        else {
            Write-Host "public_ip output was not found."
            Write-Host "Continuing without public_ip pipeline variable."
        }
      name: TerraformOutput
      displayName: 'Terraform Output'

    # -----------------------------------------------------
    # Publish Terraform Outputs
    # -----------------------------------------------------
    - powershell: |
        Write-Host "========================================"
        Write-Host "SAVE TERRAFORM OUTPUTS"
        Write-Host "========================================"

        Set-Location "$(terraformDirectory)"

        terraform output -json > "$(Build.ArtifactStagingDirectory)/terraform-output.json"

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to generate Terraform output."
            exit 1
        }
      displayName: 'Save Terraform Outputs'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Outputs'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/terraform-output.json'
        artifact: 'terraform-output'


# =========================================================
# HELM DEPLOY
# =========================================================
- stage: HelmDeploy
  displayName: Helm Deploy
  dependsOn: Terraform
  condition: succeeded()

  jobs:
  - job: HelmJob
    displayName: Helm Deployment

    steps:

    # -----------------------------------------------------
    # Download Terraform Output
    # -----------------------------------------------------
    - task: DownloadPipelineArtifact@2
      displayName: 'Download Terraform Outputs'
      inputs:
        buildType: 'current'
        artifactName: 'terraform-output'
        targetPath: '$(Pipeline.Workspace)/terraform-output'

    # -----------------------------------------------------
    # Read Terraform Output
    # -----------------------------------------------------
    - powershell: |
        Write-Host "========================================"
        Write-Host "TERRAFORM OUTPUT"
        Write-Host "========================================"

        $outputFile = "$(Pipeline.Workspace)/terraform-output/terraform-output.json"

        if (!(Test-Path $outputFile)) {
            Write-Error "Terraform output file not found."
            exit 1
        }

        Get-Content $outputFile

        $terraformOutput = Get-Content $outputFile | ConvertFrom-Json

        if ($terraformOutput.public_ip) {
            $vmIp = $terraformOutput.public_ip.value

            Write-Host "VM Public IP: $vmIp"
            Write-Host "##vso[task.setvariable variable=TerraformPublicIP]$vmIp"
        }
      displayName: 'Read Terraform Outputs'

    # -----------------------------------------------------
    # Check Helm
    # -----------------------------------------------------
    - powershell: |
        Write-Host "========================================"
        Write-Host "HELM CHECK"
        Write-Host "========================================"

        helm version

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Helm is not installed on the agent."
            exit 1
        }
      displayName: 'Check Helm'

    # -----------------------------------------------------
    # Helm Deploy
    # -----------------------------------------------------
    - powershell: |
        Write-Host "========================================"
        Write-Host "HELM DEPLOYMENT"
        Write-Host "========================================"

        Write-Host "Terraform completed successfully."
        Write-Host "Starting Helm deployment..."

        if ("$(TerraformPublicIP)" -ne "") {
            Write-Host "Terraform VM IP: $(TerraformPublicIP)"
        }

        # Change this path if your Helm chart is in another directory.
        $helmChart = "$(System.DefaultWorkingDirectory)/helm"

        if (!(Test-Path $helmChart)) {
            Write-Error "Helm chart directory not found: $helmChart"
            exit 1
        }

        helm upgrade --install myapp $helmChart

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Helm deployment failed."
            exit 1
        }

        Write-Host "Helm deployment completed successfully."
      displayName: 'Helm Upgrade Install'