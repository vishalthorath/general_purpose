
trigger:
- main

pool:
  name: batch13-pool

stages:

- stage: Build
  jobs:
  - job: Build
    steps:
    - task: PowerShell@2
      displayName: Build
      inputs:
        targetType: inline
        script: |
          Write-Host "Building application..."
          New-Item -ItemType Directory -Force -Path "$(Build.ArtifactStagingDirectory)\app"
          Copy-Item "index.html" "$(Build.ArtifactStagingDirectory)\app\"

- stage: Test
  dependsOn: Build
  jobs:
  - job: Test
    steps:
    - task: PowerShell@2
      displayName: Test
      inputs:
        targetType: inline
        script: |
          Write-Host "Running tests..."
          & ".\test.ps1"

- stage: Deploy
  dependsOn: Test
  jobs:
  - job: Deploy
    steps:
    - task: PowerShell@2
      displayName: Deploy
      inputs:
        targetType: inline
        script: |
          Write-Host "Deploying application..."
          Write-Host "Deployment successful"

